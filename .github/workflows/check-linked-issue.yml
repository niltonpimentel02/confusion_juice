name: Check linked issue

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-linked-issue:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # LABEL: missing-linked-issue
      LABEL: invalid

    steps:
      - name: Check linked issue
        shell: bash
        run: |
          set -euo pipefail

          linked_issues="$(
            gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json closingIssuesReferences \
              --jq '.closingIssuesReferences | length'
          )"

          if [ "$linked_issues" -eq 0 ]; then
            gh label create "$LABEL" \
              --repo "$GITHUB_REPOSITORY" \
              --description "Pull request has no linked issue" \
              --color "D93F0B" \
              --force

            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "$LABEL"

            already_commented="$(
              gh pr view "$PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --json comments \
                --jq 'any(.comments[].body; contains("<!-- missing-linked-issue-check -->"))'
            )"

            if [ "$already_commented" != "true" ]; then
              gh pr comment "$PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --body-file - <<'EOF'
          <!-- missing-linked-issue-check -->
          This pull request does not have a linked issue.

          Please update the **Issue Relacionada** section in the PR description:

          ```md
          ## Issue Relacionada
          <!---Todos os PRs devem ter uma issue relacionada. Dessa forma, podemos garantir que ninguém perca tempo trabalhando em algo que não precisa ser feito. -->

          Closes #<numero_da_issue>
          ```

          Replace `<numero_da_issue>` with the issue number.
          EOF
            fi
          else
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --remove-label "$LABEL" 2>/dev/null || true
          fi
